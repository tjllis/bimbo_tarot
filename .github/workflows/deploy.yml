name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # lets you re-deploy by hand from the Actions tab
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish a Pages artifact
permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race; queue instead of cancelling a live one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Pages serves the site from /<repo-name>/, so every asset URL needs that
      # prefix. Deriving it from the repo name survives a rename.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
